[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-governance-kit"
dynamic = ["version"]
description = "Agent-first project governance toolkit"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
pgk = "project_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_governance = ["templates/*.md"]

[tool.setuptools.dynamic]
version = {attr = "project_governance.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
